# Control plane: one process on one port. Deploy from the repository root:
#   fly deploy --config adapters/hosting/fly/fly.toml
# Workers stay on your own machines and connect outbound with the same token.
#   fly secrets set AGENT_TEAM_TOKEN=...
# The first deploy prints a one-time link for creating the owner account: fly logs
app = "my-agent-team"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "agent_team_data"
  destination = "/data"

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
