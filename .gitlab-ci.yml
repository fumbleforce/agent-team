verify:
  image: node:24-slim
  timeout: 25 minutes
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check
    - npm test
    - AGENT_TEAM_TEST_STORAGE=postgres npm run test:postgres
    - npm run test:sim
    - npm run build:web
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - npm run test:pack
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
